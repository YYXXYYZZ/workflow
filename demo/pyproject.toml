[project]
name = "task-api-demo"
version = "0.1.0"
description = "Local task management API PoC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
